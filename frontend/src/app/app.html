@if (showHeader()) {
  <header class="shell-header">
    <a class="brand" routerLink="/dashboard" aria-label="VitaNova home">
      <vn-logo [size]="26" />
      <span class="brand-name">Vita<strong>Nova</strong></span>
    </a>

    <nav class="shell-nav" aria-label="Main">
      <a routerLink="/dashboard" routerLinkActive="is-active">
        <vn-icon name="file" [size]="16" />
        <span>Resumes</span>
      </a>
      <a routerLink="/templates" routerLinkActive="is-active">
        <vn-icon name="layers" [size]="16" />
        <span>Designs</span>
      </a>
      <a routerLink="/" class="nav-home">
        <vn-icon name="globe" [size]="16" />
        <span>Home</span>
      </a>
    </nav>

    <div class="shell-actions">
      <vn-theme-toggle [compact]="true" />

      <div class="user-menu">
        <button
          type="button"
          class="avatar-button"
          [attr.aria-expanded]="menuOpen()"
          aria-haspopup="menu"
          [attr.aria-label]="'Account menu for ' + (user()?.email ?? '')"
          (click)="toggleMenu($event)"
        >
          <span class="avatar">{{ initials() }}</span>
          <vn-icon [name]="menuOpen() ? 'chevron-up' : 'chevron-down'" [size]="14" />
        </button>

        @if (menuOpen()) {
          <div class="menu vn-card" role="menu">
            <div class="menu-head">
              <span class="menu-name">{{ user()?.full_name || 'Your account' }}</span>
              <span class="menu-email">{{ user()?.email }}</span>
            </div>
            <a class="menu-item" routerLink="/templates" role="menuitem">
              <vn-icon name="sparkle" [size]="16" />
              Start a new resume
            </a>
            <button class="menu-item" type="button" role="menuitem" (click)="signOut()">
              <vn-icon name="logout" [size]="16" />
              Sign out
            </button>
          </div>
        }
      </div>
    </div>
  </header>
}

<main class="shell-main" [class.shell-main--bare]="!showHeader()">
  <router-outlet />
</main>

<!-- Mounted once, outside the header, so every route can ask a question. -->
<vn-confirm-dialog />
