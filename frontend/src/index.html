<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VitaNova — Resume Builder</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="VitaNova — write your experience once, typeset it in nine designs, and export a print-ready PDF that matches the preview exactly.">
  <meta name="theme-color" content="#faf7f1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!--
    Type. Three faces, each with a job: Fraunces for anything with a voice,
    Public Sans for the interface, JetBrains Mono for compositor's marks
    (eyebrows, dates, counts). All degrade to the system stack if the network
    is unavailable — see the --vn-font-* tokens in styles.scss.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=JetBrains+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400..700;1,400&display=swap"
    rel="stylesheet">

  <!--
    Theme, applied before the first paint. Angular boots too late to do this:
    a dark-theme user would see a white flash on every load. ThemeService owns
    the attribute from here on — keep the storage key and the fallback colours
    in sync with core/theme/theme.service.ts.
  -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('vitanova.theme');
        var dark = stored === 'dark'
          || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        document.querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#14120e' : '#faf7f1');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
