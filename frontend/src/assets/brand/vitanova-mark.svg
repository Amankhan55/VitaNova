<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="VitaNova">
  <title>VitaNova</title>
  <!--
    The mark reads as a V (Vita) drawn as an open vessel, with a leaf growing out
    of it (Nova — new life). The V uses currentColor so it inverts cleanly on
    dark surfaces; only the leaf carries the brand gradient.
  -->
  <defs>
    <linearGradient id="vn-leaf" x1="16" y1="26" x2="32" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <path d="M24 4C32 11 32 19 24 26C16 19 16 11 24 4Z" fill="url(#vn-leaf)"/>
  <path d="M24 8.5V23.5" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity="0.65"/>
  <path d="M9 18L24 43L39 18" fill="none" stroke="#0B1220" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
