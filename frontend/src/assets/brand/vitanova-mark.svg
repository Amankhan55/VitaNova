<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="VitaNova">
  <title>VitaNova</title>
  <!--
    A serifed V standing on a spot-colour rule — a masthead and the rule that
    separates it from the page. The letter is drawn, not set, so the mark does
    not depend on a font being available. Keep in step with
    src/app/shared/ui/logo/logo.ts, which is the version the app actually uses.
  -->
  <path d="M14.6 15.4 L24 35.8 L33.4 15.4" fill="none" stroke="#191510"
        stroke-width="4.6" stroke-linejoin="miter"/>
  <rect x="9.4" y="12.8" width="10.4" height="2.9" fill="#191510"/>
  <rect x="28.2" y="12.8" width="10.4" height="2.9" fill="#191510"/>
  <rect x="9.4" y="39.6" width="29.2" height="3" fill="#A83B21"/>
</svg>
